name: Windows checks

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ps51:
    name: Test Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Synthetic tests, packaging and privacy
        shell: powershell
        run: ./tests/Run-Tests.ps1

  check-ps7:
    name: Test PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Synthetic tests, packaging and privacy
        shell: pwsh
        run: ./tests/Run-Tests.ps1

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-ps51, check-ps7]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build reviewed files
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Publish ZIP and checksum
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Publish-Release.ps1
